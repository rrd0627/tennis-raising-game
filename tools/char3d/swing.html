const CAMS = {
  q34: { p: [-2.3, 1.45, -2.6], t: [-0.25, 0.9, 0.35] }, side: { p: [-3.6, 1.15, 0.6], t: [-0.25, 0.95, 0.25] },
  back: { p: [0.9, 1.75, -3.4], t: [-0.2, 0.95, 0.6] }, front: { p: [-0.9, 1.35, 3.6], t: [-0.2, 0.95, 0] },
  tps: { p: [0.45, 1.95, -2.4], t: [-0.3, 0.9, 4.0] }, tv: { p: [1.2, 7.5, -9.5], t: [0.3, 0.4, 6.5] }, top: { p: [-0.2, 4.2, 0.25], t: [-0.2, 0, 0.25], up: [0, 0, 1] },
  hand: { p: [-0.42, 0.12, 0.62], follow: 'rightHand' },   // 손 가까이: 오른손을 따라가며 비스듬히 앞에서

const trailHist = [];
function ballButtons() {

  btn(bar1, '차례로', () => ballMode = 'auto', 'b', ballMode === 'auto');
  for (const k of S.order) btn(bar1, S.balls[k][0], () => ballMode = k, 'b', ballMode === k);
}
function chooseShot(id) { setShot(id); ballButtons(); clock = 0; rep = 0; trailHist.length = 0; }
setShot(q.get('shot') || 'fh');
for (const s of SHOTS) btn(barS, s.name, () => chooseShot(s.id), 'sh', s.id === S.id.replace(/:hand$/, ''));
ballButtons();
for (const k of Object.keys(CAMS)) btn(bar2, CAM_NAME[k], () => camK = k, 'c', camK === k);
const srcBtn = btn(bar3, useHand ? '동작: 손으로 짠 것' : '동작: 모션캡처', () => { useHand = !useHand; srcBtn.textContent = useHand ? '동작: 손으로 짠 것' : '동작: 모션캡처'; chooseShot(S.id.replace(/:hand$/, '')); });

const HANDLES = [
  ['rh', '오른손', 0xff4f86], ['rp', '오른팔꿈치', 0xff9a3c], ['rk', '라켓', 0xd81b60], ['lh', '왼손', 0x3d8bff], ['lp', '왼팔꿈치', 0x2ec4d6],

function drawElbowRing() {
