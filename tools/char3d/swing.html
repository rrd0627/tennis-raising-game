<!-- 3D 캐릭터에 포핸드를 입히고 공 높이·거리에 맞춰 IK로 라켓 가운데를 공에 맞히는 시험 화면(개발용).
     동작은 손으로 짠 임시 동작이다(실제는 촬영한 동작으로 바꾼다). 경기 결과와는 상관없다.
     http://localhost:8080/tools/char3d/swing.html?cam=q34|side|back|front|tps|tv|top|hand&ik=1&ball=auto|mid|low|high|far|near|early|late&t=0(멈춤)&speed=0.5
     동작을 고친 뒤에는 node tools/char3d/jointcheck.mjs로 관절 범위·튐·뚫음을 확인한다 -->
<div id="stage"></div>
<div id="ui"><div class="bar" id="bar0"><a href="../../?check">← 확인 목록</a></div><div class="bar" id="bar1"><small>공</small></div><div class="bar" id="bar2"><small>시점</small></div><div class="bar" id="bar3"></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js';

const q = new URLSearchParams(location.search);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const D = Math.PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ── 장면 ──
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true;
document.getElementById('stage').append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd0f0);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 80);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fa6b8, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 2.1); sun.position.set(-3, 6, 2); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); scene.add(sun);
{ // 코트 바닥(하드), 베이스라인, 서비스 라인, 네트
  const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), new THREE.MeshBasicMaterial({ color: 0x7ccfa8 })); g.rotation.x = -Math.PI / 2; g.position.z = 6; scene.add(g);
  const court = new THREE.Mesh(new THREE.PlaneGeometry(10.97, 23.77), new THREE.MeshBasicMaterial({ color: 0x3f7fd0 })); court.rotation.x = -Math.PI / 2; court.position.set(0.6, 0.004, 11.6); scene.add(court);
  const lineM = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const line = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineM); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.008, z); scene.add(m); };
  line(10.97, 0.05, 0.6, -0.3); line(8.23, 0.05, 0.6, 5.2); line(0.05, 23.77, 0.6 - 4.115, 11.6); line(0.05, 23.77, 0.6 + 4.115, 11.6); line(0.05, 6.4, 0.6, 8.4);
  const net = new THREE.Mesh(new THREE.PlaneGeometry(12.8, 0.914), new THREE.MeshBasicMaterial({ color: 0x223040, transparent: true, opacity: 0.55, side: THREE.DoubleSide })); net.position.set(0.6, 0.457, 11.6); scene.add(net);
  const top = new THREE.Mesh(new THREE.BoxGeometry(12.8, 0.05, 0.02), lineM); top.position.set(0.6, 0.914, 11.6); scene.add(top);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.22 })); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.01; sh.receiveShadow = true; scene.add(sh);
}

// ── 캐릭터 ──
const loader = new GLTFLoader(); loader.register(p => new VRMLoaderPlugin(p));
const gltf = await loader.loadAsync(q.get('glb') || 'vroid_sample.vrm');   // VRoid로 만든 pixiv 공식 샘플(VRM 공개 라이선스 1.0, 재배포·수정·상업 이용 허용)
const vrm = gltf.userData.vrm; VRMUtils.rotateVRM0(vrm);
vrm.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
scene.add(vrm.scene);
const H = vrm.humanoid, B = n => H.getNormalizedBoneNode(n);
const BONES = ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head', 'leftUpperLeg', 'leftLowerLeg', 'leftFoot', 'rightUpperLeg', 'rightLowerLeg', 'rightFoot',
  'leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand', 'rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand'].filter(n => B(n));
// 처음(T 자세) 자리
for (const n of BONES) B(n).quaternion.identity();
vrm.scene.updateMatrixWorld(true);
const REST = {}; for (const n of BONES) REST[n] = B(n).getWorldPosition(V3());
const HIPS0 = B('hips').position.clone();
const ARM = REST.rightUpperArm.distanceTo(REST.rightLowerArm) + REST.rightLowerArm.distanceTo(REST.rightHand);
const ANKLE = REST.rightFoot.y;

// ── 라켓: 원점은 손잡이 가운데, +Y가 라켓 머리 쪽, +Z가 줄 면의 앞 ──
const SWEET = 0.45;
const racket = new THREE.Group();
{
  const dark = new THREE.MeshToonMaterial({ color: 0x2a2a30 }), frame = new THREE.MeshToonMaterial({ color: 0xff6f8e }), white = new THREE.MeshToonMaterial({ color: 0xf4f4f4 });
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.017, 0.2, 10), dark); grip.position.y = 0.02; racket.add(grip);
  for (const sx of [-1, 1]) { const t = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.008, 0.2, 6), frame); t.position.set(sx * 0.045, 0.215, 0); t.rotation.z = -sx * 0.28; racket.add(t); }
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 6, 40), frame); ring.scale.set(0.128, 0.168, 0.13); ring.position.y = SWEET + 0.02; racket.add(ring);
  const cnv = document.createElement('canvas'); cnv.width = cnv.height = 128; const cx = cnv.getContext('2d');
  cx.strokeStyle = '#ffffffcc'; cx.lineWidth = 2; for (let i = 4; i < 128; i += 10) { cx.beginPath(); cx.moveTo(i, 0); cx.lineTo(i, 128); cx.moveTo(0, i); cx.lineTo(128, i); cx.stroke(); }
  const str = new THREE.Mesh(new THREE.CircleGeometry(1, 32), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cnv), transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  str.scale.set(0.122, 0.162, 1); str.position.y = SWEET + 0.02; racket.add(str);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.02, 10), white); cap.position.y = -0.085; racket.add(cap);
  racket.traverse(o => { if (o.isMesh) o.castShadow = true; });
}
// 손에 쥐는 법(오른손 기준, 손의 처음 방향: 손가락 -x, 손바닥 -y, 엄지 +z). 이스턴~세미웨스턴: 손잡이가 손바닥을 비스듬히(검지 뿌리 → 새끼 쪽 손바닥 아래) 지나고
// 줄 면은 손바닥과 나란하다. 손잡이 축은 손가락 뿌리 아래 약 3cm를 지나고, 끝(버트)은 새끼손가락 바로 밖에 온다. 손가락은 손잡이를 감싸게 굽힌다(setFingers)
const GRIP_SHAFT = V3(-0.45, 0, 0.89).normalize(), GRIP_FACE = V3(0, -1, 0);
const GRIP_POS = V3(-0.062, -0.024, 0.002).add(GRIP_SHAFT.clone().multiplyScalar(0.04));
const GRIP_M = new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(GRIP_SHAFT, GRIP_FACE), GRIP_SHAFT, GRIP_FACE);   // 라켓의 x,y,z → 손 기준(x = y × z)
racket.matrixAutoUpdate = false; B('rightHand').add(racket);
racket.matrix.copy(GRIP_M).setPosition(GRIP_POS);
const gripQ = new THREE.Quaternion().setFromRotationMatrix(GRIP_M);
// 왼손이 라켓 목을 잡을 때: 오른손 쥐는 법을 거울에 비춘 것. 라켓 목(손잡이 쪽에서 THROAT_Y)을 손바닥에 둔다
const THROAT_Y = 0.17, GRIP_SHAFT_L = V3(0.45, 0, 0.89).normalize();
const GRIP_ML = new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(GRIP_SHAFT_L, GRIP_FACE), GRIP_SHAFT_L, GRIP_FACE);
const gripQL = new THREE.Quaternion().setFromRotationMatrix(GRIP_ML);
const GRIP_POS_L = V3(0.062, -0.0275, 0.002).add(GRIP_SHAFT_L.clone().multiplyScalar(-0.005 - THROAT_Y));
// 원하는 라켓 방향(손잡이→머리 s, 줄 면 앞 f)이 되는 손의 세계 회전
function handQuatFor(s, f) {
  s = s.clone().normalize(); f = f.clone().sub(s.clone().multiplyScalar(f.dot(s))).normalize();
  const x = new THREE.Vector3().crossVectors(s, f);
  const rq = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, s, f));   // 라켓의 세계 회전
  return rq.multiply(gripQ.clone().invert());
}
// 손목 자리에서 라켓 가운데(스윗 스폿)까지
function sweetFrom(wrist, hq) { return GRIP_POS.clone().add(V3(0, SWEET, 0).applyQuaternion(gripQ)).applyQuaternion(hq).add(wrist); }

// 손가락: 손잡이를 감싸는 각도(도). 손잡이 축에 마디가 고르게 닿도록 맞춘 값이다(손가락 두께 포함)
const CURL = { Index: [30, 48, 39], Middle: [48, 58, 48], Ring: [60, 46, 42], Little: [64, 38, 30] };
const THUMB = { opp: 37.5, flex: [-10, 0, 52] };   // 엄지는 손바닥 쪽으로 돌려(맞섬) 손잡이 너머 검지 쪽으로 감는다
const FAX = V3(0, 0, 1).lerp(GRIP_SHAFT, 0.55).normalize(), TAX = V3(0.65, 0, 0.76).normalize(), OAX = V3(1, 0, 0);
const mirAx = v => V3(v.x, -v.y, -v.z);   // 축(회전)을 왼손으로 비출 때
const FINGER_BONES = [];
for (const s of ['right', 'left']) { for (const f of Object.keys(CURL)) for (const j of ['Proximal', 'Intermediate', 'Distal']) FINGER_BONES.push(s + f + j); for (const j of ['Metacarpal', 'Proximal', 'Distal']) FINGER_BONES.push(s + 'Thumb' + j); }
function setFingers(side, k) {
  const R = side === 'right', fax = R ? FAX : mirAx(FAX), tax = R ? TAX : mirAx(TAX), oax = R ? OAX : mirAx(OAX);
  for (const [f, a] of Object.entries(CURL)) ['Proximal', 'Intermediate', 'Distal'].forEach((j, i) => B(side + f + j)?.quaternion.setFromAxisAngle(fax, a[i] * k * D));
  B(side + 'ThumbMetacarpal')?.quaternion.setFromAxisAngle(oax, THUMB.opp * k * D).multiply(new THREE.Quaternion().setFromAxisAngle(tax, THUMB.flex[0] * k * D));
  B(side + 'ThumbProximal')?.quaternion.setFromAxisAngle(tax, THUMB.flex[1] * k * D);
  B(side + 'ThumbDistal')?.quaternion.setFromAxisAngle(tax, THUMB.flex[2] * k * D);
}

// ── 공 ──
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.034, 16, 12), new THREE.MeshToonMaterial({ color: 0xe8f040 })); ball.castShadow = true; scene.add(ball);
const ballShadow = new THREE.Mesh(new THREE.CircleGeometry(0.035, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })); ballShadow.rotation.x = -Math.PI / 2; scene.add(ballShadow);
const TRAIL = 22, trailPos = new Float32Array(TRAIL * 3);
const trail = new THREE.Line(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(trailPos, 3)), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
trail.frustumCulled = false; scene.add(trail);
const hitMark = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.075, 24), new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide, transparent: true, depthTest: false }));
hitMark.renderOrder = 9; scene.add(hitMark);

// ── 포핸드 동작(손으로 짠 임시 동작) ──
// 시간은 임팩트가 0. 자리는 선수 기준(발 사이 바닥이 원점, +z가 네트 쪽, +x가 선수의 왼쪽). 각도는 도. 키마다 필요한 칸만 적고, 없는 칸은 앞뒤 키에서 이어진다
// hip: [x, 높이 변화, z, 돌기], chest: [허리 위 돌기(골반 기준), 앞으로 숙임, 오른쪽 어깨 내림]
// rf/lf: 발 앞꿈치(엄지발가락 뿌리 밑 바닥) [x, z, 발끝 방향, 들기]. 디딘 발은 앞꿈치를 축으로 돈다. rheel: 오른발 뒤꿈치 드는 각도
// rh: 오른손목 자리, s/f: 라켓 방향(손잡이→머리)과 줄 면 앞, rp: 팔꿈치가 향하는 쪽(임팩트 앞뒤는 손목·어깨가 편하고 팔꿈치가 몸에 닿지 않는 쪽을 찾아 정함), lh: 왼손목('throat'이면 라켓 목을 잡음), lp: 왼팔꿈치 쪽
const READY = { hip: [0, -0.06, 0, 0], chest: [0, 9, 0], rf: [-0.2, 0.11, -6, 0], lf: [0.2, 0.11, 6, 0], rheel: [0], rh: [-0.1, 0.98, 0.17], s: [0.25, 0.5, 1], f: [1, 0, -0.25], rp: [-0.6, -1, -0.3], lh: 'throat', lp: [0.7, -1, 0] };
const K = [
  { t: -1.55, ...READY },
  // 스플릿 스텝: 두 발이 살짝 떴다가 넓게 내려앉는다
  { t: -1.12, hip: [0, -0.03, 0, 0], chest: [0, 8, 0], rf: [-0.21, 0.11, -6, 0.03], lf: [0.21, 0.11, 6, 0.03], rh: [-0.1, 1.0, 0.17], s: [0.25, 0.5, 1], f: [1, 0, -0.25], rp: [-0.6, -1, -0.3], lh: 'throat', lp: [0.7, -1, 0] },
  { t: -0.98, hip: [0, -0.12, 0, -5], chest: [-3, 10, 0], rf: [-0.255, 0.11, -10, 0], lf: [0.245, 0.13, 8, 0], rh: [-0.12, 0.93, 0.16], s: [0.2, 0.5, 1], f: [1, 0, -0.2], rp: [-0.6, -1, -0.3], lh: 'throat', lp: [0.7, -1, 0] },
  // 오른발을 들어 옆으로 내딛고(유닛턴), 왼발도 작게 고쳐 딛는다. 왼손은 라켓 목을 밀어 주다가 놓는다
  { t: -0.9, rf: [-0.29, 0.09, -20, 0.045] },
  { t: -0.86, lf: [0.21, 0.155, -8, 0.035] },
  { t: -0.72, hip: [-0.05, -0.1, -0.03, -42], chest: [-38, 9, 0], rf: [-0.47, -0.04, -56, 0.07], lf: [0.18, 0.175, -22, 0], rh: [-0.34, 1.02, 0.1], s: [-0.45, 0.85, 0.15], f: [0.1, -0.35, 1], rp: [-0.4, -1, -0.5], lh: [-0.36, 1.18, 0.32], lp: [0.6, -1, 0.2] },
  { t: -0.56, rf: [-0.51, -0.062, -60, 0.025] },
  // 테이크백 끝: 오른발에 무게를 싣고 라켓은 위로
  { t: -0.4, hip: [-0.09, -0.12, -0.04, -54], chest: [-46, 8, 2], rf: [-0.515, -0.065, -60, 0], lf: [0.18, 0.175, -25, 0], rh: [-0.46, 1.1, -0.17], s: [-0.15, 0.95, 0.2], f: [-1, -0.25, 0.1], rp: [-0.3, -0.8, -0.9], lh: [-0.1, 1.15, 0.45], lp: [0.9, -0.44, 0.01] },
  // 라켓 떨어뜨리기(머리가 등 뒤로 처짐) → 팔꿈치를 굽힌 채 몸 가까이로 끌고 와서 → 임팩트에서 뻗는다
  { t: -0.16, hip: [-0.06, -0.12, -0.02, -38], chest: [-38, 9, 8], rf: [-0.515, -0.065, -60, 0], rh: [-0.39, 0.86, -0.1], s: [-0.4, -0.55, -0.75], f: [0.05, -1, 0.35], rp: [0.7, -0.72, -0.01], lh: [0.04, 1.1, 0.4], lp: [0.9, -0.21, -0.39] },
  { t: -0.05, hip: [-0.01, -0.1, 0.05, -10], chest: [-18, 11, 8], rf: [-0.515, -0.065, -50, 0], rheel: [3], rh: [-0.32, 0.9, 0.2], s: [-0.92, -0.2, -0.35], f: [0, 0.1, 1], rp: [0.35, -0.71, -0.61], lh: [0.12, 1.1, 0.32], lp: [0.9, -0.15, -0.41] },
  // 임팩트: 몸 앞(앞꿈치보다 앞)에서, 팔을 거의 뻗어서(팔 길이의 약 93%) 맞힌다. 골반은 조금 열리고 가슴은 네트를 본다
  { t: 0, hip: [0.03, -0.09, 0.1, 6], chest: [-6, 13, 6], rf: [-0.515, -0.065, -38, 0], rheel: [10], rh: [-0.29, 0.94, 0.43], s: [-0.97, 0.15, -0.08], f: [0.02, 0.05, 1], rp: [0.15, -0.77, -0.62], lh: [0.15, 1.1, 0.32], lp: [0.73, -0.45, -0.51] },
  // 팔로스로: 라켓 머리가 위로 올라 왼쪽 머리 옆을 지나 왼어깨 뒤로 내려간다(와이퍼). 오른발은 앞꿈치로 돌며 뒤꿈치가 든다
  { t: 0.08, rh: [-0.1, 1.05, 0.52], s: [-0.46, 0.87, -0.19], f: [0.03, 0.23, 0.97], rp: [0.46, -0.83, -0.3] },
  { t: 0.14, hip: [0.05, -0.07, 0.11, 14], chest: [12, 10, 0], rf: [-0.515, -0.065, -26, 0], rheel: [20], rh: [0.06, 1.15, 0.44], rp: [0.01, -0.98, -0.21], lh: [0.18, 1.12, 0.26], lp: [0.55, -1, 0.1] },

    const ankleAt = ph => pivot.clone().add(rel.clone().applyAxisAngle(ax, ph * D)).add(V3(0, Math.max(0, lift), 0));
    const L = LIMB[side + 'Leg'], H = wp(L.up), reach = (L.l1 + L.l2) * 0.94;
    let heel = side === 'right' ? Math.max(0, sample(t, 'rheel')[0]) : 0;
    const over = ankleAt(heel).distanceTo(H) - reach;   // 다리가 넘치는 길이: 1cm마다 약 7도(앞꿈치에서 발목까지 길이로 잰 값), 시작은 부드럽게
    if (over > 0) heel = Math.min(38, heel + 700 * over * over / (over + 0.01));
    legMiss.push(ik(L, ankleAt(heel), fwd.clone().add(V3(0, 0.25, 0))));
    // 정강이가 옆으로 18도보다 많이 기울면 그만큼 발도 날로 기운다(발목이 꺾이지 않게)
    const shin = wp(side + 'LowerLeg').sub(wp(side + 'Foot')).normalize(), out_ = ax.clone().negate();
    const lean_ = Math.atan2(shin.dot(out_), shin.y), roll = lean_ - soft(lean_, -18 * D, 18 * D);
    setWorldQuat(B(side + 'Foot'), new THREE.Quaternion().setFromAxisAngle(fwd, roll).multiply(yq).multiply(new THREE.Quaternion().setFromAxisAngle(V3(1, 0, 0), heel * D)));
    B(side + 'Toes')?.quaternion.setFromAxisAngle(V3(1, 0, 0), -heel * D);
  }
  // 오른팔: 라켓 방향을 정하고, 공에 맞게 손목 자리를 옮긴다
  const wt = useIK ? (t < 0 ? corrW(t) : 1 - sstep(0, 0.18, t)) : 0;
  const hq = new THREE.Quaternion().setFromAxisAngle(TILT_AX, wt * tiltOf(dl)).multiply(sampleQ(t));   // 낮은 공은 라켓 머리를 떨어뜨려서, 높은 공은 세워서
  const rh = V3(...sample(t, 'rh')).add(S);
  if (w > 0) {
    // 임팩트 순간의 라켓 가운데가 공에 오도록: 임팩트 때 손목이 있어야 할 자리 - 원래 자리
    const hq0 = new THREE.Quaternion().setFromAxisAngle(TILT_AX, tiltOf(dl)).multiply(HQ7);
    const want0 = C0.clone().add(dl).sub(sweetFrom(V3(), hq0));
    rh.add(want0.sub(V3(...K7.rh)).sub(S0).multiplyScalar(w));
  }
  const rp = V3(...sample(t, 'rp')), sDir = V3(0, 1, 0).applyQuaternion(hq.clone().multiply(gripQ)), lam = 0.0005 + 0.02 * faceW(t);
  // 라켓을 축으로 돌린 양(롤)은 미리 구한 기준 곡선에서. 임팩트 앞뒤에는 실제(손목 범위에 묶인) 라켓의 가운데가 원래 자리(공)에 오도록 손목 자리를 다시 잡는다
  const roll = new THREE.Quaternion().setFromAxisAngle(sDir, (collect ? 0 : rollBase('R', t)) * D).multiply(hq);
  const wantSweet = sweetFrom(rh, hq), wf = w * (1 - sstep(0.02, 0.16, t));
  let miss = 0, hqA = hq, tgt = rh;
  for (let it = 0; it < 6; it++) {
    miss = ik(LIMB.rightArm, tgt, rp);
    if (collect && it === 0) { const c = rollCost('right', hq, sDir, lam); collect.R = ROLL_TH.map(c); }
    hqA = wrist('right', roll);
    if (wf <= 0) break;
    const need = wantSweet.clone().sub(sweetFrom(V3(), hqA));
    tgt = tgt.clone().lerp(rh.clone().add(need.sub(rh).clampLength(0, 0.2).multiplyScalar(wf)), 0.5);   // 반씩 옮겨 두 자세 사이를 오가지 않게
  }
  setFingers('right', 1);
  // 왼팔: 라켓 목을 잡거나(오른손을 거울에 비춘 쥐는 법, 목 둘레 어디든 손목이 편한 쪽) 공 쪽으로 뻗는다
  const tw = throatW(t), rqW = hqA.clone().multiply(gripQ), rOrg = GRIP_POS.clone().applyQuaternion(hqA).add(wp('rightHand'));
  const sA = V3(0, 1, 0).applyQuaternion(rqW), gqi = gripQL.clone().invert();
  const holdQ = th => new THREE.Quaternion().setFromAxisAngle(sA, th * D).multiply(rqW).multiply(gqi);
  const holdP = hl => rOrg.clone().sub(GRIP_POS_L.clone().applyQuaternion(hl));
  const lp = () => V3(...sample(t, 'lp'));
  let hqL = holdQ(0);
  const lhAt = hl => { const h = holdP(hl); return V3(...sample(t, 'lh', h.toArray())).add(S.clone().setY(crouch).multiplyScalar(1 - tw)).lerp(h, tw); };
  ik(LIMB.leftArm, lhAt(hqL), lp());
  if (collect) { const c = rollCost('left', hqL, sA, 0.0005); collect.L = ROLL_TH.map(th => holdWgt(tw) * c(th)); }
  else if (tw > 0) { hqL = holdQ(rollBase('L', t)); ik(LIMB.leftArm, lhAt(hqL), lp()); }

  return { miss, hq: hqA, legMiss };
}
buildRoll();
// 고개: 공을 보다가 임팩트 직전부터 맞는 자리에 고개를 두고, 맞힌 뒤 잠깐 그대로 있다가 공을 따라가고, 다음 공이 올 쪽으로 돌아간다
const FAR = V3(C0.x + 1.4, 1.0, 22.5);
function lookTarget(t, C, bp, hit) {
  if (t < 0) return bp.clone().lerp(C, sstep(-0.3, -0.04, t));
  return C.clone().lerp(bp, hit ? sstep(0.2, 0.45, t) : 0).lerp(FAR, sstep(0.5, 1.0, t));
}
function lookAt(target) {
  const neck = B('neck'), head = B('head'); if (!neck || !head) return;
  neck.parent.updateMatrixWorld(true);
  const hp = wp('head'), loc = target.clone().sub(hp);
  const pq = new THREE.Quaternion(); neck.parent.getWorldQuaternion(pq);
  loc.applyQuaternion(pq.invert());
  const yaw = clamp(Math.atan2(loc.x, loc.z) / D, -80, 80), pitch = clamp(-Math.atan2(loc.y, Math.hypot(loc.x, loc.z)) / D, -35, 45);
  neck.quaternion.copy(eul(pitch * 0.4, yaw * 0.45, 0)); head.quaternion.copy(eul(pitch * 0.6, yaw * 0.55, 0));
  vrm.scene.updateMatrixWorld(true);
}

// ── 공의 길: 상대 쪽에서 떠서 한 번 튀고 임팩트 자리로, 맞으면 돌아간다 ──
const G = 9.8;
function ballAt(t, C, hit) {
  const P0 = V3(C.x + 1.4, 1.0, 22.5), Bp = V3(C.x + 0.35, 0, C.z + 5.2), tb = -0.52, t0 = -1.5;
  if (t < tb) { const T = tb - t0, u = t - t0; const v = Bp.clone().sub(P0).divideScalar(T); const vy = (Bp.y - P0.y + 0.5 * G * T * T) / T; return V3(P0.x + v.x * u, P0.y + vy * u - 0.5 * G * u * u, P0.z + v.z * u); }
  if (t < 0 || !hit) { const T = -tb, u = t - tb; const v = C.clone().sub(Bp).divideScalar(T); const vy = (C.y + 0.5 * G * T * T) / T; const p = V3(Bp.x + v.x * u, vy * u - 0.5 * G * u * u, Bp.z + v.z * u); if (p.y < 0) p.y = -p.y * 0.6; return p; }
  const E = V3(C.x + 2.5, 0, C.z + 14), T = 0.95, u = t; const v = E.clone().sub(C).divideScalar(T); const vy = (E.y - C.y + 0.5 * G * T * T) / T;
  return V3(C.x + v.x * u, C.y + vy * u - 0.5 * G * u * u, C.z + v.z * u);
}

// ── 화면 ──
// 시점: 카메라 자리와 보는 곳. 세로 화면(휴대폰)에서는 가로로 덜 보이므로 뒤로 물러선다
const CAMS = {
  q34: { p: [-2.3, 1.45, -2.6], t: [-0.25, 0.9, 0.35] }, side: { p: [-3.6, 1.15, 0.6], t: [-0.25, 0.95, 0.25] },
  back: { p: [0.9, 1.75, -3.4], t: [-0.2, 0.95, 0.6] }, front: { p: [-0.9, 1.35, 3.6], t: [-0.2, 0.95, 0] },
  tps: { p: [0.45, 1.95, -2.4], t: [-0.3, 0.9, 4.0] }, tv: { p: [1.2, 7.5, -9.5], t: [0.3, 0.4, 6.5] }, top: { p: [-0.2, 4.2, 0.25], t: [-0.2, 0, 0.25], up: [0, 0, 1] },
  hand: { p: [-0.42, 0.12, 0.62], follow: 'rightHand' },   // 손 가까이: 오른손을 따라가며 비스듬히 앞에서
};
const CAM_NAME = { q34: '뒤 비스듬히', side: '옆', back: '뒤', front: '앞', tps: '어깨 너머', tv: '중계', top: '위', hand: '손 가까이' };
const camFollow = V3();
function applyCam(k) {
  const c = CAMS[k];
  if (c.follow) { camFollow.lerp(wp(c.follow).add(V3(0.04, 0, 0)), 0.25); cam.position.copy(camFollow).add(V3(...c.p)); cam.up.set(0, 1, 0); cam.lookAt(camFollow); return; }
  const t = V3(...c.t), p = V3(...c.p);
  const fit = k === 'tps' || k === 'tv' ? 1 : Math.max(1, Math.pow(1.25 / cam.aspect, 0.8));
  cam.position.copy(t).add(p.sub(t).multiplyScalar(fit));
  cam.up.set(...(c.up || [0, 1, 0])); cam.lookAt(t); cam.up.set(0, 1, 0);
}
if (q.get('ui') === '0') for (const id of ['ui', 'note']) document.getElementById(id).style.display = 'none';
window.__vrm = vrm; window.__B = B;
let camK = q.get('cam') || 'q34', ballMode = q.get('ball') || 'auto', speed = +(q.get('speed') || 1), frozen = q.get('t') != null ? +q.get('t') : null;
const bar1 = document.getElementById('bar1'), bar2 = document.getElementById('bar2'), bar3 = document.getElementById('bar3'), note = document.getElementById('note');
const btn = (bar, label, fn, group, on) => { const b = document.createElement('button'); b.textContent = label; b.dataset.g = group || ''; b.onclick = () => { if (group) for (const x of bar.querySelectorAll(`button[data-g="${group}"]`)) x.classList.toggle('on', x === b); fn(); }; if (on) b.classList.add('on'); bar.append(b); return b; };
btn(bar1, '차례로', () => ballMode = 'auto', 'b', ballMode === 'auto');
for (const k of ORDER) btn(bar1, BALLS[k].name, () => ballMode = k, 'b', ballMode === k);
for (const k of Object.keys(CAMS)) btn(bar2, CAM_NAME[k], () => camK = k, 'c', camK === k);
const ikBtn = btn(bar3, 'IK 켬', () => { useIK = !useIK; ikBtn.textContent = useIK ? 'IK 켬' : 'IK 끔'; ikBtn.classList.toggle('on', useIK); }, null, useIK);
if (!useIK) ikBtn.textContent = 'IK 끔';
for (const sp of [1, 0.5, 0.25]) btn(bar3, sp === 1 ? '보통 빠르기' : `${sp}배`, () => speed = sp, 's', speed === sp);

let clock = 0, rep = 0, last = performance.now(), manual = false, seq = null;
const trailHist = [];
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!manual) tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt) {
  let t;
  if (frozen != null) t = frozen; else { clock += dt * speed; if (clock > LOOP) { clock -= LOOP; rep++; trailHist.length = 0; } t = T0 + clock; }
  const key = ballMode === 'auto' ? (seq || ORDER)[rep % (seq || ORDER).length] : ballMode;
  const C = C0.clone().add(V3(...BALLS[key].d));
  const r = pose(t, key);
  // 임팩트 순간 라켓 가운데와 공의 거리(맞았는지)
  const tc = 0; let err;
  { const save = BONES.map(n => B(n).quaternion.clone()), hp = B('hips').position.clone();
    const r0 = pose(tc, key); err = sweetFrom(wp('rightHand'), r0.hq).distanceTo(C);
    BONES.forEach((n, i) => B(n).quaternion.copy(save[i])); B('hips').position.copy(hp); pose(t, key); }
  const hit = err < 0.09;
  const bp = ballAt(Math.min(t, 1.2), C, hit);
  lookAt(lookTarget(t, C, bp, hit));
  vrm.update(dt);
  ball.position.copy(bp); ballShadow.position.set(bp.x, 0.012, bp.z);
  trailHist.push(bp.clone()); if (trailHist.length > TRAIL) trailHist.shift();
  for (let i = 0; i < TRAIL; i++) { const p = trailHist[Math.max(0, trailHist.length - TRAIL + i)] || bp; trailPos.set([p.x, p.y, p.z], i * 3); }
  trail.geometry.attributes.position.needsUpdate = true;
  hitMark.visible = Math.abs(t) < 0.12; hitMark.position.copy(C); hitMark.lookAt(cam.position);
  hitMark.material.color.set(hit ? 0x33dd77 : 0xff3366);
  applyCam(camK);
  note.innerHTML = `${BALLS[key].name} · 임팩트 높이 ${C.y.toFixed(2)}m · 라켓 가운데와 공 ${Math.round(err * 100)}cm ${hit ? '맞음' : '빗나감'} · IK ${useIK ? '켬' : '끔'}<br>동작은 손으로 짠 임시 동작(실제는 촬영 동작으로)`;
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
// 영상으로 찍을 때: 시간을 정해진 만큼씩 흘린다
window.__rec = { start: (order) => { manual = true; frozen = null; clock = 0; rep = 0; seq = order || null; trailHist.length = 0; ballMode = 'auto'; }, step: dt => tick(dt), get rep() { return rep; } };
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
window.__swing = { set: o => { if (o.t !== undefined) frozen = o.t; if (o.ball) ballMode = o.ball; if (o.cam) camK = o.cam; if (o.ik != null) useIK = o.ik; if (o.speed) speed = o.speed; } };
// 관절 검사(개발용): 자세를 시간마다 만들어 관절 각도와 튀는 곳을 잰다
window.__dbg = { wrist, LIMB, ik, sample, sampleQ, K, handQuatFor, gripQ, gripQL, GRIP_POS, GRIP_POS_L, THREE, pose, lookAt, lookTarget, ballAt, sweetFrom, B, BONES, ALLB, T0, T1, LOOP, ORDER, BALLS, C0, racket, vrm, SWEET, ANKLE, setIK: v => { useIK = v; } };
window.__ready = true;
</script>
