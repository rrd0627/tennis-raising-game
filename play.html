<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테니스 선수 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<style>
/* 레이아웃: 세로 모바일 한 화면(최대 480px). 클럽 코트의 인조잔디·테니스공·개나리/국화 색으로 만든 밝은 단일 테마 */
:root {
  --paper: #f6f8f1;
  --card: #ffffff;
  --ink: #1f2b24;
  --muted: #6c7a70;
  --line: #dde5d6;
  --turf: #2f8a5b;
  --turf-deep: #1f6a44;
  --ball: #e4f24a;
  --pink: #ff6f9c;
  --pink-soft: #ffe3ec;
  --gae: #f2c230;
  --guk: #a57de0;
  --good: #2fa36b;
  --bad: #e0484f;
  --gold: #ffb72e;
  --f-display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; -webkit-tap-highlight-color: transparent; }
#app { max-width: 480px; margin: 0 auto; height: 100%; overflow-y: auto; overflow-x: hidden; position: relative; background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
small { color: var(--muted); }
.muted { color: var(--muted); }
.tiny { font-size: 11px; color: var(--muted); text-align: center; }
.pos { color: var(--good); } .neg { color: var(--bad); }

.screen { min-height: 100%; padding-block: 12px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { font-size: 17px; display: flex; gap: 8px; align-items: baseline; }
.card p { margin: 0; line-height: 1.55; }
.hint { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* 버튼·칩 */
.btn { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 3px 0 #d94f7d; }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #d94f7d; }
.btn.big { padding: 15px; font-size: 16px; font-family: var(--f-display); font-weight: 400; width: 100%; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }
.chip small { font-size: 10px; }
.chip.sm { padding: 5px 10px; font-size: 12px; }
.chip.on { background: var(--turf); border-color: var(--turf); color: #fff; }
.chip.on small { color: #d6f5e3; }
.chip:disabled { opacity: .35; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

/* 초상 */
img.pt, .pt { width: 72px; height: 72px; border-radius: 50%; background: var(--pink-soft); border: 2px solid var(--card); box-shadow: 0 2px 0 var(--line); object-fit: cover; flex: none; }
.pt.sm { width: 44px; height: 44px; }
.pt.xs { width: 30px; height: 30px; }
.pt.sys { display: grid; place-items: center; font-size: 28px; background: #eef6d0; }
.pt.sm.sys { font-size: 20px; }

/* 타이틀 */
.title { align-items: center; text-align: center; justify-content: center; background: radial-gradient(120% 60% at 50% 0%, #e9f7c9 0%, var(--paper) 60%); }
.logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.logo .ball { font-size: 44px; animation: bounce 1.6s ease-in-out infinite; }
.logo h1 { font-size: 44px; line-height: 1.05; color: var(--turf-deep); }
.logo p { margin: 0; color: var(--muted); }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { .logo .ball { animation: none; } }
.title-pt { width: 150px; height: 150px; border-radius: 50%; background: var(--pink-soft); }
.intro { background: var(--bg); color: #fff; justify-content: center; align-items: center; text-align: center; position: relative; padding-bottom: 12px; cursor: pointer; transition: background .6s; }
.introskip { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; color: #fff; opacity: .85; font-size: 13px; padding: 8px; }
.scene { display: flex; flex-direction: column; gap: 20px; align-items: center; animation: scenein .7s ease-out; }
.scene .ic { font-size: 84px; line-height: 1; }
.scene p { margin: 0; font-family: var(--f-display); font-size: 22px; line-height: 1.45; word-break: keep-all; max-width: 320px; }
@keyframes scenein { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .scene { animation: none; } }
.dots { position: absolute; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); }
.dots i.on { background: #fff; }
/* 실제 그림이 등록된 타이틀과 인트로 (art/manifest.json 의 bg.title, intro) */
.title.hasbg { position: relative; overflow: hidden; }
.title.hasbg > :not(.bgimg) { position: relative; z-index: 1; }
.title.hasbg .logo h1, .title.hasbg .logo p, .title.hasbg .tapstart, .title.hasbg .tiny { color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
.introimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
.intro.hasimg { overflow: hidden; }
.intro.hasimg .scene { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 56px 24px calc(64px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .62) 40%); }
.intro.hasimg .scene .ic { display: none; }
.intro.hasimg .dots, .intro.hasimg .introskip { z-index: 2; }
.title { cursor: pointer; }
.tapstart { margin: 8px 0 0; font-family: var(--f-display); font-size: 20px; color: var(--turf-deep); animation: tappulse 1.6s ease-in-out infinite; }
@keyframes tappulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .tapstart { animation: none; } }
/* 코치와의 첫 대화. 인트로 마지막 컷과 같은 배경에서 이어진다 */
.talk { background: #3a9a6a; align-items: center; justify-content: center; }
.talk .title-pt { background: #fff; }
.talkline { background: var(--card); border-radius: 18px; padding: 16px 18px; font-size: 17px; line-height: 1.55; word-break: keep-all; width: 100%; text-align: center; animation: scenein .35s ease-out; }
.nameline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; width: 100%; }
.nameline input { font: inherit; font-size: 17px; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--card); color: var(--ink); min-width: 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.opt { background: var(--card); border-radius: 12px; padding: 14px 10px; font-weight: 700; text-align: center; word-break: keep-all; animation: scenein .35s ease-out; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.lbl { font-weight: 700; font-size: 12px; color: var(--muted); letter-spacing: .02em; }

/* 상단 바 */
.topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; background: var(--paper); padding-block: 4px; }
.topbar .wk { font-family: var(--f-display); font-size: 19px; }
.topbar .sub { font-size: 11px; color: var(--muted); }
.topbar .badge { margin-left: auto; }
.topbar .back { font-size: 28px; line-height: 1; padding: 0 6px; }
.badge { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; }
.badge.div-개나리 { background: #fff3c4; color: #8a6400; }
.badge.div-국화 { background: #efe4ff; color: #5b3aa0; }

.bar { height: 8px; background: #e9eee4; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--turf); border-radius: 99px; }

.alert { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--turf); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.alert.tour { border-left-color: var(--gold); background: #fff8e6; }
.alert.bad { border-left-color: var(--bad); background: #fff0f0; }
.alert.good { border-left-color: var(--guk); background: #f6f0ff; }
.alert.big { font-size: 16px; font-family: var(--f-display); }

/* 주간·결과 화면: 우마무스메 육성 화면처럼 장소와 캐릭터가 화면을 채우고, UI는 그 위에 얹는다 */
.screen.home { padding: 0; gap: 0; height: 100%; min-height: 0; position: relative; overflow: hidden; container-type: size; background: #7cc8f2; }
.screen.home[data-a] { cursor: pointer; }
.bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; pointer-events: none; user-select: none; }

/* 위: 남은 턴 달력, 목표, 체력, 기분 */
.uhud { position: relative; z-index: 4; flex: none; display: flex; flex-direction: column; gap: 4px; padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 0; }
.hudtop { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-right: 34px; min-height: 22px; }
.gearbtn { position: absolute; right: 10px; top: calc(5px + env(safe-area-inset-top, 0px)); width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, .94); font-size: 14px; line-height: 1; box-shadow: 0 2px 5px rgba(0, 0, 0, .25); }
.yr { background: rgba(30, 40, 62, .78); color: #fff; border-radius: 99px; font-size: 11px; font-weight: 700; padding: 2px 9px; white-space: nowrap; }
.hudtop .badge { font-size: 11px; padding: 2px 8px; }
.hudmain { display: flex; align-items: stretch; gap: 8px; }
.ucal { --cal: #3f8fe6; flex: none; width: 70px; position: relative; display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px solid var(--cal); border-radius: 10px; padding: 12px 0 2px; box-shadow: 0 2px 6px rgba(0, 0, 0, .28); }
.ucal::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--cal); border-radius: 6px 6px 0 0; }
.ucal b { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1; color: var(--cal); }
.ucal small { font-size: 10px; font-weight: 800; color: var(--cal); }
.ucal.urgent { --cal: #e8456b; }
.hudr { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 5px; }
.goalbar { flex: 1; display: flex; align-items: stretch; min-height: 32px; background: rgba(255, 255, 255, .96); border: 2px solid #4fb266; border-radius: 10px; box-shadow: 0 2px 6px rgba(0, 0, 0, .22); overflow: hidden; }
.goalbar i { flex: none; display: flex; align-items: center; padding: 0 8px; background: #4fb266; color: #fff; font-style: normal; font-weight: 800; font-size: 11px; }
.goalbar span { align-self: center; padding: 2px 8px; font-size: 12px; font-weight: 700; line-height: 1.25; word-break: keep-all; }
.energy { display: flex; align-items: center; gap: 6px; }
.energy small { color: #fff; font-weight: 800; font-size: 11px; text-shadow: 0 1px 2px rgba(0, 0, 0, .75), 0 0 2px rgba(0, 0, 0, .6); }
.ebar { position: relative; flex: 1; min-width: 0; height: 15px; border-radius: 99px; overflow: hidden; border: 2px solid #fff; background: linear-gradient(90deg, #ef4a40, #ff9a2e 25%, #ffe04d 50%, #7fd45a 72%, #39b6ff); box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
.ebar i { position: absolute; top: 0; bottom: 0; right: 0; background: #474c57; transition: width .8s ease-out; }
.mood { flex: none; font-size: 11px; font-weight: 800; color: #fff; border: 2px solid #fff; border-radius: 99px; padding: 1px 8px; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); white-space: nowrap; }
.mood.m0 { background: #7a6bd1; } .mood.m1 { background: #4f97dc; } .mood.m2 { background: #f2a21e; } .mood.m3 { background: #ff7f45; } .mood.m4 { background: #ff4f85; }

/* 가운데: 캐릭터. 발은 능력치 줄 뒤로 들어간다 */
.hero { flex: 1 1 auto; min-height: 0; position: relative; z-index: 1; }
.heroimg { position: absolute; left: 50%; bottom: -34px; height: min(90%, 130cqw); aspect-ratio: 1; max-width: none; transform: translateX(-50%); filter: drop-shadow(0 6px 5px rgba(0, 0, 0, .25)); animation: idle 2.6s ease-in-out infinite; pointer-events: none; user-select: none; }
@keyframes idle { 50% { transform: translateX(-50%) translateY(-5px); } }
.ribbon { position: absolute; left: 0; top: 6px; z-index: 3; max-width: 78%; padding: 5px 24px 5px 10px; background: linear-gradient(90deg, #2d7fe0, #59b0f4); color: #fff; font-weight: 800; font-size: 13px; clip-path: polygon(0 0, 100% 0, calc(100% - 13px) 100%, 0 100%); animation: ribbonin .22s ease-out; }
@keyframes ribbonin { from { transform: translateX(-20px); opacity: 0; } }
.sidebtns { position: absolute; right: 10px; top: 6px; z-index: 3; display: flex; flex-direction: column; gap: 7px; }
.sidebtn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .94); font-size: 18px; position: relative; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.sidebtn i { position: absolute; top: -3px; right: -3px; background: var(--pink); color: #fff; font-style: normal; font-size: 10px; border-radius: 99px; padding: 1px 6px; font-weight: 800; }
.say { position: absolute; left: 10px; bottom: 28px; z-index: 3; max-width: 70%; display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .96); border-radius: 14px; padding: 8px 12px; font-size: 13.5px; line-height: 1.4; word-break: keep-all; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); animation: scenein .25s ease-out; }
.say::after { content: ''; position: absolute; right: 22px; top: -7px; border: 7px solid transparent; border-bottom-color: rgba(255, 255, 255, .96); border-top: 0; }
.say.info { flex-direction: column; align-items: flex-start; gap: 2px; max-width: 66%; }
.say.info .fc { color: #d9346b; font-weight: 700; }
.risk { position: absolute; right: 10px; bottom: 28px; z-index: 3; display: flex; flex-direction: column; align-items: center; color: #fff; border: 2px solid #fff; border-radius: 12px; padding: 3px 9px; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); animation: scenein .25s ease-out; }
.risk small { color: inherit; font-size: 10px; font-weight: 700; }
.risk b { font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.1; }
.risk.lv0 { background: #3f8fe6; } .risk.lv1 { background: #f2901e; } .risk.lv2 { background: #e0363f; }

/* 결과 연출: 이름 띠, 큰 숫자, 기분 띠, 화면 전환 */
.bgimg.dim { filter: brightness(.5) saturate(.75); }
.ribbon.evt { display: flex; flex-direction: column; gap: 0; padding: 3px 28px 4px 10px; background: linear-gradient(90deg, #f0447e, #ff86ad); line-height: 1.2; }
.ribbon.evt small { color: #ffe6ee; font-size: 11px; font-weight: 700; }
.ribbon.evt b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.burst { --glow: #ffb01f; position: absolute; left: 50%; top: 75%; z-index: 3; width: 170px; height: 124px; margin: -62px 0 0 -85px; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; animation: burstin .4s cubic-bezier(.2, 1.5, .4, 1) both; }
.burst::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle, var(--glow) 0 34%, transparent 72%); opacity: .75; clip-path: polygon(50% 0, 60% 28%, 92% 12%, 74% 42%, 100% 50%, 74% 58%, 92% 88%, 60% 72%, 50% 100%, 40% 72%, 8% 88%, 26% 58%, 0 50%, 26% 42%, 8% 12%, 40% 28%); }
.burst.poor { --glow: #8aa0c4; }
.burst b { font-family: var(--f-display); font-weight: 400; font-size: 50px; line-height: 1; color: #f2570f; font-variant-numeric: tabular-nums; text-shadow: 0 0 2px #fff, 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 3px 0 #fff; }
.burst.poor b { color: #3f6fb5; }
.burst small { color: #5a2c0a; font-family: var(--f-display); font-size: 17px; text-shadow: 0 0 2px #fff, 1px 1px 0 #fff, -1px 1px 0 #fff, 1px -1px 0 #fff, -1px -1px 0 #fff; }
.burst.poor small { color: #24406e; }
@keyframes burstin { from { transform: scale(.3); opacity: 0; } }
.moodband { position: absolute; left: 50%; bottom: 5px; z-index: 3; transform: translateX(-50%); white-space: nowrap; color: #fff; font-family: var(--f-display); font-size: 15px; padding: 3px 16px; border: 2px solid #fff; border-radius: 99px; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); animation: scenein .35s ease-out .35s both; }
.moodband.down { background: linear-gradient(#3f8fe6, #2467c0); }
.moodband.up { background: linear-gradient(#ff7aa8, #f0447e); }
/* 등급 상승, 큰 글자, 도장 */
.bigword { position: absolute; left: 8px; right: 8px; top: 10%; z-index: 3; text-align: center; font-family: var(--f-display); font-size: 34px; line-height: 1.15; word-break: keep-all; pointer-events: none; animation: bigin .45s cubic-bezier(.2, 1.5, .4, 1) both; }
.bigword small { display: block; font-size: 15px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.bigword.good { color: #ffdc3f; -webkit-text-stroke: 1px #c8761a; text-shadow: 0 0 14px rgba(255, 190, 40, .95), 0 3px 0 #c8761a; }
.bigword.bad { color: #d7e7ff; -webkit-text-stroke: 1px #2d5ea8; text-shadow: 0 0 12px rgba(50, 110, 200, .85), 0 3px 0 #2d5ea8; }
@keyframes bigin { from { transform: scale(.4); opacity: 0; } }
.stamp { position: absolute; left: 50%; top: 9%; z-index: 3; white-space: nowrap; color: #ffe14d; font-family: var(--f-display); font-size: 40px; line-height: 1; -webkit-text-stroke: 1.5px #d06a12; text-shadow: 0 3px 0 #d06a12, 0 0 16px rgba(255, 180, 30, .85); transform: translateX(-50%) rotate(-5deg); pointer-events: none; animation: stampin .35s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampin { from { transform: translateX(-50%) rotate(-5deg) scale(2.2); opacity: 0; } }
.rankpop { position: absolute; left: 50%; top: 50%; z-index: 3; width: 190px; height: 190px; margin: -95px 0 0 -95px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle, rgba(255, 244, 190, .98) 0 52%, rgba(255, 196, 60, .55) 68%, transparent 72%); pointer-events: none; animation: bigin .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.rankpop small { color: #6a3d06; font-size: 14px; font-weight: 800; }
.rankpop b { font-family: var(--f-display); font-weight: 400; font-size: 84px; line-height: 1; -webkit-text-stroke: 2px #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
.rankpop span { color: #c8491a; font-family: var(--f-display); font-size: 17px; }
.screen.home.hopping .heroimg { animation: hop .5s ease-out, idle 2.6s ease-in-out .5s infinite; }
@keyframes hop { 40% { transform: translateX(-50%) translateY(-26px); } }
/* 행동 중 움직임 */
.heroimg.fa { animation: idle 2.6s ease-in-out infinite, frameA .9s steps(1) infinite; }
.heroimg.fb { animation: idle 2.6s ease-in-out infinite, frameB .9s steps(1) infinite; }
@keyframes frameA { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes frameB { 0% { opacity: 0; } 50% { opacity: 1; } }
.fxball { position: absolute; left: 50%; top: 56%; z-index: 2; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6ff8a, #cfe02f); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); animation: rally .9s ease-in-out infinite; }
@keyframes rally { 0%, 100% { transform: translate(120px, -30px) scale(.8); } 50% { transform: translate(-130px, 6px) scale(1.15); } }
.floaty { position: absolute; left: 62%; top: 26%; z-index: 3; pointer-events: none; }
.floaty i { position: absolute; font-style: normal; font-family: var(--f-display); font-size: 26px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .55); opacity: 0; animation: floatup 2.1s ease-out infinite; }
.floaty i:nth-child(2) { left: 22px; font-size: 21px; animation-delay: .7s; }
.floaty i:nth-child(3) { left: 40px; font-size: 17px; animation-delay: 1.4s; }

.trow { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.trow.national { border-left: 4px solid var(--gold); }
.tw { font-weight: 800; font-size: 12px; display: flex; flex-direction: column; }
.tn { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ta { font-size: 12px; text-align: right; }
.ta .ok { color: var(--good); font-weight: 700; }
.tag { font-size: 10px; border-radius: 6px; padding: 1px 6px; font-weight: 800; }
.tag.national { background: #fff1c9; color: #8a5a00; }
.tag.local { background: #e8f3ff; color: #2c5d99; }
.rank { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.rank div:first-child { display: flex; flex-direction: column; }
.rank .big { font-family: var(--f-display); font-size: 24px; color: var(--turf-deep); }
.resrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.st { margin-left: auto; }
.st-W { color: var(--gold); } .st-F, .st-SF { color: var(--turf); }
.prow { display: flex; gap: 10px; align-items: center; }
.prow > div { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }

/* 능력치 */
.stat { display: grid; grid-template-columns: 112px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 13px; }
.stat span { display: flex; flex-direction: column; line-height: 1.2; }
.stat span small { font-size: 10px; }
.stat b { font-variant-numeric: tabular-nums; display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.g { font-style: normal; font-family: var(--f-display); font-weight: 400; border-radius: 6px; padding: 0 5px; font-size: 12px; background: #eef1ea; }
.g-S { background: var(--gold); color: #fff; } .g-A { background: var(--pink); color: #fff; } .g-B { background: var(--turf); color: #fff; } .g-C { background: #8fc9a6; color: #fff; }

/* 대회 */
.tour-head { border-radius: 18px; padding: 18px; color: #fff; background: linear-gradient(135deg, var(--turf) 0%, var(--turf-deep) 100%); display: flex; flex-direction: column; gap: 4px; }
.tour-head.national { background: linear-gradient(135deg, #3a6fb0 0%, #24497a 100%); }
.tour-head small { color: #d9f0e2; }
.tour-head h2 { font-size: 28px; }
.tour-head p { margin: 0; }
.vs { display: flex; align-items: center; gap: 8px; }
.vs > div { display: flex; flex-direction: column; min-width: 0; }
.vs .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; line-height: 1.5; flex: 1; }
.opp { display: flex; gap: 6px; align-items: center; }
.opp > div { display: flex; flex-direction: column; min-width: 0; margin-left: 4px; }

/* 경기 화면 */
.screen.match { padding: 0; gap: 0; height: 100%; min-height: 0; }
.stage { position: relative; flex: 1 1 auto; min-height: 320px; background: #cfeefe; overflow: hidden; }
.stage canvas { display: block; width: 100% !important; height: 100% !important; }
.stage.textmode { background: linear-gradient(#3f9d63, #2f7d4c); }
.scorebox { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; background: rgba(16, 28, 44, .88); color: #fff; border-radius: 10px; padding: 6px 8px; font-size: 12px; min-width: 210px; z-index: 2; }
.scorebox small { color: #b8c7d8; font-size: 10px; }
.scorebox .sr { display: grid; grid-template-columns: 12px 1fr 22px 38px; gap: 4px; align-items: center; }
.scorebox .sr span { color: var(--ball); font-size: 9px; }
.scorebox .sr b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scorebox em { font-style: normal; font-weight: 800; text-align: center; background: rgba(255,255,255,.12); border-radius: 4px; }
.scorebox i { font-style: normal; color: var(--ball); font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.biglabel { position: absolute; top: 74px; left: 50%; transform: translateX(-50%) scale(.8); background: var(--pink); color: #fff; font-family: var(--f-display); font-size: 18px; padding: 6px 16px; border-radius: 999px; opacity: 0; transition: .25s; z-index: 2; white-space: nowrap; }
.biglabel.show { opacity: 1; transform: translateX(-50%) scale(1); }
.pointtext { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 13px; opacity: 0; z-index: 2; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.pointtext.show { animation: pop 1.6s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 6px); } 12% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
.cutin { position: absolute; inset: 30% 0 auto; height: 34%; display: none; align-items: center; gap: 10px; padding: 0 16px; z-index: 3; background: repeating-linear-gradient(100deg, rgba(255,255,255,.95) 0 14px, rgba(255,240,246,.95) 14px 18px); transform: skewY(-4deg); }
.cutin.them { background: repeating-linear-gradient(100deg, rgba(235,242,255,.95) 0 14px, rgba(220,232,255,.95) 14px 18px); }
.cutin.show { display: flex; animation: slide .95s ease-out; }
.cutin img { height: 110%; border-radius: 50%; transform: skewY(4deg); }
.cutin b { font-family: var(--f-display); font-weight: 400; font-size: 34px; color: var(--pink); transform: skewY(4deg); text-shadow: 2px 2px 0 #fff; }
.cutin.them b { color: #3a6fb0; }
@keyframes slide { 0% { transform: skewY(-4deg) translateX(-100%); } 15% { transform: skewY(-4deg) translateX(0); } 85% { transform: skewY(-4deg) translateX(0); opacity: 1; } 100% { transform: skewY(-4deg) translateX(30%); opacity: 0; } }
.hud { background: var(--paper); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
.mentals { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.mg { display: grid; grid-template-columns: 56px 1fr 40px; gap: 6px; align-items: center; font-size: 11px; }
.mg span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.mg.them span { color: #3a6fb0; }
.mg small { font-size: 10px; }
.bar i.m-몰입 { background: var(--gold); } .bar i.m-보통 { background: var(--turf); } .bar i.m-흔들림 { background: #f08a4b; } .bar i.m-틸트 { background: var(--bad); }
.tempo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tempobtn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 4px; font-weight: 800; font-size: 14px; }
.tempobtn.t-attack.on { background: #e8584f; border-color: #e8584f; color: #fff; }
.tempobtn.t-normal.on { background: var(--turf); border-color: var(--turf); color: #fff; }
.tempobtn.t-safe.on { background: #3a6fb0; border-color: #3a6fb0; color: #fff; }
.tempobtn { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.tempobtn small { font-size: 10px; font-weight: 600; color: var(--pink); }
.tempobtn.on small { color: #fff; }
.plan { gap: 10px; }
.morebtn { align-self: flex-start; }
.pdetail { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; border-top: 1px dashed var(--line); padding-top: 8px; width: 100%; }
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; }
.logline { font-size: 12px; color: var(--muted); min-height: 16px; }
.coachrec { display: flex; gap: 8px; align-items: center; background: #eef6ff; border-radius: 12px; padding: 6px 8px; font-size: 12px; }
.coachrec span { flex: 1; }
.crow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 6px; align-items: start; }
.crow > span { font-size: 12px; font-weight: 700; padding-top: 6px; color: var(--muted); }
.crow > div { display: flex; flex-wrap: wrap; gap: 4px; }

/* 리포트 */
.result-banner { text-align: center; font-family: var(--f-display); font-size: 40px; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; color: #fff; }
.result-banner small { color: inherit; font-family: var(--f-body); font-size: 13px; opacity: .9; }
.result-banner.win { background: linear-gradient(135deg, var(--pink), #ff9a6b); }
.result-banner.lose { background: linear-gradient(135deg, #8a96a8, #5f6b7d); }
table.rep { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.rep th, table.rep td { padding: 6px 4px; border-bottom: 1px dashed var(--line); text-align: center; }
table.rep td:first-child { text-align: left; color: var(--muted); }
.cbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 12px; }
.cbar b { text-align: right; font-variant-numeric: tabular-nums; }

.ending { align-items: center; text-align: center; justify-content: center; background: radial-gradient(120% 60% at 50% 0%, #fff3c4 0%, var(--paper) 60%); }
.ending .logo h1 { font-size: 36px; }

.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(31, 43, 36, .94); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 50; font-size: 13px; line-height: 1.5; max-width: min(440px, calc(100% - 32px)); transition: opacity .4s; }
.toast.out { opacity: 0; }
#newver { position: fixed; left: 50%; top: calc(36px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; white-space: nowrap; background: var(--pink); color: #fff; font-weight: 800; font-size: 13px; padding: 9px 16px; border-radius: 99px; box-shadow: 0 3px 12px rgba(0, 0, 0, .35); }
/* 대사가 다 나오기 전에는 넘김 표시와 선택지를 숨긴다 (자리는 지킨다) */
.typing .tapnext, .typing .picks { visibility: hidden; }

\uB294 \uC5B4\uAE68\uC5D0 \uD798\uC774 \uC548 \uB4E4\uC5B4\uAC04\uB2E4.',ok:"\uC774\uC81C \uD3B8\uD574\uC694"}],sumin:[{at:50,text:'\uC774\uC218\uBBFC: "\uC624\uB298 \uBA87 \uC2DC\uC5D0 \uB05D\uB098? \uB098 \uD5EC\uC2A4\uC7A5 \uBA3C\uC800 \uAC00 \uC788\uC744\uAC8C." \uD68C\uC0AC \uBA54\uC2E0\uC800\uAC00 \uC6B4\uB3D9 \uC57D\uC18D\uC73C\uB85C \uCC3C\uB2E4.',ok:"\uAE08\uBC29 \uAC08\uAC8C"},{at:80,text:'\uC774\uC218\uBBFC: "\uB108 \uC624\uB298 \uC65C \uC774\uB807\uAC8C \uD3B8\uD558\uAC8C \uCCD0?" \uB3D9\uAE30 \uC55E\uC5D0\uC11C\uB294 \uC798 \uBCF4\uC77C \uD544\uC694\uAC00 \uC5C6\uB2E4. \uC5B4\uB514\uB85C \uC6C0\uC9C1\uC77C\uC9C0\uB3C4 \uC774\uC81C \uC548\uB2E4.',ok:"\uB108\uB2C8\uAE4C"}],daeun:[{at:50,text:'\uC815\uB2E4\uC740: "\uC81C\uAC00 \uC55E\uC5D0 \uC788\uC744 \uB54C \uB85C\uBE0C \uC62C\uB9AC\uBA74, \uB4A4\uB85C \uC548 \uBE60\uC838\uB3C4 \uB3FC\uC694?" \uB458\uC774\uC11C \uC6C0\uC9C1\uC784\uC744 \uB9DE\uCDB0 \uBCF4\uAE30 \uC2DC\uC791\uD588\uB2E4.',ok:"\uB9DE\uCDB0 \uBD10\uC694"},{at:80,text:'\uC815\uB2E4\uC740\uC774 \uC6C0\uC9C1\uC774\uAE30 \uC804\uC5D0 \uB0B4 \uBC1C\uC774 \uBA3C\uC800 \uB3CC\uC558\uB2E4. \uC815\uB2E4\uC740: "\uC55E\uC740 \uC81C\uAC00, \uB4A4\uB294 \uC5B8\uB2C8\uAC00." \uC774\uC81C \uD3EC\uCE58\uAC00 \uB098\uC640\uB3C4 \uB2F9\uD669\uD558\uC9C0 \uC54A\uB294\uB2E4.',ok:"\uBBFF\uC744\uAC8C"}],jiwoo:[{at:50,text:'\uD55C\uC9C0\uC6B0: "\uC5B8\uB2C8, \uC800 \uC2DC\uD5D8 \uB05D\uB098\uBA74 \uBCBD\uCE58\uAE30 \uAC19\uC774 \uD574\uC694!" \uC5B4\uB290\uC0C8 \uC2DC\uD5D8 \uAE30\uAC04\uC744 \uC678\uC6B0\uACE0 \uC788\uB2E4.',ok:"\uC2DC\uD5D8 \uC798 \uBD10"},{at:80,text:'\uD55C\uC9C0\uC6B0: "\uC5B8\uB2C8, \uC81C\uAC00 \uB6F8 \uAC70 \uC544\uC168\uC8E0?" \uACF5\uC774 \uC5B4\uB514\uB85C \uAC00\uB4E0 \uC9C0\uC6B0\uAC00 \uB6F8 \uCABD\uC774 \uBA3C\uC800 \uBCF4\uC778\uB2E4. \uB355\uBD84\uC5D0 \uB098\uB294 \uB0B4 \uACF5\uB9CC \uCE58\uBA74 \uB41C\uB2E4.',ok:"\uC54C\uC9C0"}],arah:[{at:50,text:'\uC11C\uC544\uB77C: "\uC544\uAE4C \uADF8 \uACF5, \uC65C \uAC70\uAE30\uB85C \uC92C\uC5B4?" \uB9D0\uD22C\uB294 \uADF8\uB300\uB85C\uC778\uB370 \uAC19\uC774 \uB0A8\uC544\uC11C \uBCF5\uAE30\uB97C \uD55C\uB2E4.',ok:"\uB2E4\uC2DC \uD574 \uBCF4\uC790"},{at:80,text:'\uC11C\uC544\uB77C: "\u2026\uC774\uC81C \uC880 \uB9DE\uB124." \uAC15\uD0C0 \uB4A4\uC5D0 \uBB50\uAC00 \uC62C\uC9C0 \uC548\uB2E4. \uC800 \uC0AC\uB78C \uC606\uC5D0\uC11C\uB3C4 \uC774\uC81C \uC228\uC774 \uC548 \uB9C9\uD78C\uB2E4.',ok:"\uADF8\uB7EC\uAC8C"}],mikyung:[{at:50,text:'\uC624\uBBF8\uACBD: "\uC624\uB298 \uAE09\uD588\uC5B4\uC694. \uC65C \uAE09\uD588\uB294\uC9C0 \uC54C\uC544\uC694?" \uBCA0\uD14C\uB791\uC774 \uB0B4 \uACBD\uAE30\uB97C \uBCF4\uACE0 \uC788\uC5C8\uB2E4.',ok:"\uC54C\uB824 \uC8FC\uC138\uC694"},{at:80,text:'\uC624\uBBF8\uACBD: "\uC774\uC81C \uC11C\uB450\uB974\uC9C0 \uC54A\uB124\uC694." \uD55C \uBC15\uC790 \uB2A6\uAC8C \uC6C0\uC9C1\uC5EC\uB3C4 \uC5B4\uB514\uB85C \uC62C\uC9C0 \uC548\uB2E4. \uC2B9\uBD80\uCC98\uC5D0\uC11C \uC190\uC774 \uB5A8\uB9AC\uC9C0 \uC54A\uC558\uB2E4.',ok:"\uB355\uBD84\uC774\uC5D0\uC694"}],yujin:[{at:50,text:'\uCD5C\uC720\uC9C4: "\uC11C\uBE0C \uD1A0\uC2A4 \uD55C \uBC88\uB9CC \uB354 \uBCF4\uC5EC \uC918 \uBD10\uC694." \uC120\uC218 \uCD9C\uC2E0\uC774 \uB0B4 \uC11C\uBE0C\uB97C \uBD10 \uC8FC\uAE30 \uC2DC\uC791\uD588\uB2E4.',ok:"\uB124!"},{at:80,text:'\uCD5C\uC720\uC9C4: "\uADF8\uB798\uC694, \uADF8 \uC790\uB9AC." \uC120\uC218 \uCD9C\uC2E0 \uC606\uC5D0 \uC11C\uB3C4 \uB354\uB294 \uC791\uC544\uC9C0\uC9C0 \uC54A\uB294\uB2E4. \uB0B4 \uACF5\uC744 \uCE58\uBA74 \uB41C\uB2E4\uB294 \uAC78 \uC54C\uC558\uB2E4.',ok:"\uB124"}]},ql=["{p}\uAC00 \uC5B4\uB514\uB85C \uAC08\uC9C0 \uC54C\uC558\uB2E4. \uC0DD\uAC01\uD558\uAE30 \uC804\uC5D0 \uBAB8\uC774 \uBA3C\uC800 \uC6C0\uC9C1\uC600\uB2E4.","{p} \uC606\uC5D0\uC11C\uB294 \uC2E4\uC218\uD574\uB3C4 \uAD1C\uCC2E\uB2E4. \uC5B4\uAE68\uC5D0 \uD798\uC774 \uBE60\uC9C0\uB2C8 \uACF5\uC774 \uD3B8\uD558\uAC8C \uB098\uAC14\uB2E4.","\uB9D0\uC744 \uC548 \uD574\uB3C4 \uB9DE\uB294\uB2E4. {p}\uB3C4 \uC6C3\uACE0 \uC788\uC5C8\uB2E4."],Td={stroke:'\uCF54\uCE58: "\uB7A0\uB9AC\uC5D0\uC11C \uBA3C\uC800 \uC2E4\uC218\uD558\uB354\uB77C\uACE0\uC694. \uC2A4\uD2B8\uB85C\uD06C\uB97C \uC7A1\uC544 \uBD05\uC2DC\uB2E4."',net:'\uCF54\uCE58: "\uB124\uD2B8 \uC55E\uC5D0\uC11C \uBC1C\uB9AC\uAC00 \uC790\uAFB8 \uB728\uB354\uB77C\uACE0\uC694. \uADF8\uAC70 \uD574 \uBCFC\uB798\uC694?"',serve:'\uCF54\uCE58: "\uB354\uBE14\uD3F4\uD2B8\uB85C \uC900 \uD3EC\uC778\uD2B8\uAC00 \uB9CE\uC558\uC5B4\uC694. \uC11C\uBE0C\uBD80\uD130 \uC7A1\uC544\uC694."',physical:'\uCF54\uCE58: "\uB9C8\uC9C0\uB9C9 \uACBD\uAE30\uC5D0\uC11C \uBC1C\uC774 \uC548 \uC6C0\uC9C1\uC774\uB358\uB370\uC694? \uCCB4\uB825 \uD0A4\uC6CC \uBD10\uC694."',mental:'\uCF54\uCE58: "\uC2E4\uC218 \uD558\uB098\uC5D0 \uD45C\uC815\uC774 \uBB34\uB108\uC9C0\uB354\uB77C\uACE0\uC694. \uADF8\uAC83\uB3C4 \uC5F0\uC2B5\uC774\uC5D0\uC694."',c_moon:'\uCF54\uCE58: "\uBB38\uBC1C\uB9AC\uC5D0 \uACC4\uC18D \uB2F9\uD558\uB358\uB370\uC694? \uB192\uC740 \uACF5 \uCC98\uB9AC\uD558\uB294 \uBC95 \uBC30\uC6CC \uBD10\uC694."',c_slice:'\uCF54\uCE58: "\uC2AC\uB77C\uC774\uC2A4\uAC00 \uB0AE\uAC8C \uC624\uB2C8\uAE4C \uBABB \uBC1B\uB354\uB77C\uACE0\uC694? \uADF8\uAC70 \uBC30\uC6CC \uBCFC\uB798\uC694?"',c_lob:'\uCF54\uCE58: "\uB85C\uBE0C \uC62C\uB77C\uAC00\uBA74 \uBA48\uCDB0 \uC11C\uB354\uB77C\uACE0\uC694. \uB4A4\uB85C \uB3C4\uB294 \uBC95 \uC54C\uB824 \uC904\uAC8C\uC694."',c_drop:'\uCF54\uCE58: "\uB4DC\uB86D\uC0F7\uC5D0 \uCCAB\uBC1C\uC774 \uB2A6\uC5B4\uC694. \uC55E\uC73C\uB85C \uB6F0\uB294 \uC5F0\uC2B5 \uD574\uC694."',c_angle:'\uCF54\uCE58: "\uC575\uAE00\uB85C \uBE60\uC9C0\uB294 \uACF5\uC744 \uB193\uCE58\uB354\uB77C\uACE0\uC694. \uADF8\uCABD \uC7A1\uC544 \uBD10\uC694."',c_power:'\uCF54\uCE58: "\uAC15\uD55C \uC11C\uBE0C\uC5D0 \uB77C\uCF13\uC774 \uB2A6\uC5B4\uC694. \uB9AC\uD134 \uC790\uC138 \uB2E4\uC2DC \uBD10\uC694."',c_poach:'\uCF54\uCE58: "\uC0C1\uB300 \uC804\uC704\uD55C\uD14C \uC790\uAFB8 \uC798\uB824\uC694. \uD3EC\uCE58 \uD53C\uD558\uB294 \uBC95 \uD574 \uBD10\uC694."',c_body:'\uCF54\uCE58: "\uBAB8\uCABD \uACF5\uC5D0 \uC6C0\uCC14\uD
