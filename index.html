<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테니스 선수 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
</head>
<body>
<div id="app"></div>
<script>
// GitHub Pages는 파일을 10분쯤 캐시한다. 빌드 번호를 붙여 올린 즉시 새 코드를 받게 한다.
(async () => {
  let q = '';
  try {
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) q = '?v=' + (await r.text()).trim();
  } catch { /* 번호를 못 받으면 그냥 연다 */ }
  const base = new URL('.', location.href).href;
  const imports = { three: base + 'vendor/three.module.min.js' };
  for (const f of ['art', 'checks', 'commentary', 'data', 'game', 'main', 'match3d', 'stadium', 'ball', 'rally', 'scenes', 'sim', 'ui', 'players3d', 'rig3d', 'swings', 'swings_mocap']) imports[base + 'js/' + f + '.js'] = base + 'js/' + f + '.js' + q;
  const map = document.createElement('script');
  map.type = 'importmap'; map.textContent = JSON.stringify({ imports });
  document.head.append(map);
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'css/style.css' + q;
  document.head.append(css);
  const main = document.createElement('script');
  main.type = 'module'; main.src = 'js/main.js' + q;
  document.body.append(main);
  // 열어 둔 탭은 저절로 바뀌지 않으니 새 버전이 나오면 알려 준다. 저장은 브라우저에 남아 있다.
  if (!q) return;
  const check = async () => {
    if (document.getElementById('newver')) return;
    try {
      const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok || '?v=' + (await r.text()).trim() === q) return;
      const b = document.createElement('button');
      b.id = 'newver'; b.textContent = '새 버전이 나왔어요. 눌러서 새로고침';
      b.onclick = () => location.reload();
      document.body.append(b);
    } catch { /* 오프라인이면 넘어간다 */ }
  };
  setInterval(check, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();
</script>
</body>
</html>
